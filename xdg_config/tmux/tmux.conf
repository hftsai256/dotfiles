set -g mouse on
set -g mode-keys vi
set -s set-clipboard on
bind Escape copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy || xclip -selection clipboard"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy || xclip -selection clipboard"
set -g default-terminal "tmux-256color"
set -sg escape-time 0
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g allow-passthrough all
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -as terminal-features ',*:RGB'
set -g extended-keys on
set -g extended-keys-format csi-u

set -g status-position top
set -g status-justify left
set -g status-interval 10
set -g status-right-length 80
set -g status-right "\
#[fg=#{@noctalia_surface_container_high},bg=#{@noctalia_surface_container_low}]\
#[fg=#{@noctalia_on_surface_variant},bg=#{@noctalia_surface_container_high}]  \
#(free -b | awk '/^Mem:/ {printf \"%.1fGB/%.1fGB\", $3/1e9, $2/1e9}') \
#[fg=#{@noctalia_surface_container_highest},bg=#{@noctalia_surface_container_high}]\
#[fg=#{@noctalia_on_surface},bg=#{@noctalia_surface_container_highest}]  #{cpu_percentage} \
#[fg=#{@noctalia_primary},bg=#{@noctalia_surface_container_highest}]\
#[fg=#{@noctalia_on_primary},bg=#{@noctalia_primary},bold] %Y-%m-%d %H:%M "
set -g status-left-length 40
set -g window-status-separator " "
set -g window-status-style none
set -g window-status-current-style none
set -g status-left "\
#[fg=#{@noctalia_on_primary},bg=#{@noctalia_primary},bold]  \
#[fg=#{@noctalia_primary},bg=#{@noctalia_surface_container_low}]\
#[fg=#{@noctalia_on_surface},bg=#{@noctalia_surface_container_low}] #S \
#[fg=#{@noctalia_on_surface},bg=#{@noctalia_surface_container_low}] "
set -g window-status-format "\
#[fg=#{@noctalia_surface_container_high},bg=#{@noctalia_surface_container_low}]\
#[fg=#{@noctalia_on_surface_variant},bg=#{@noctalia_surface_container_high}] #I \
#[fg=#{@noctalia_on_surface_variant},bg=#{@noctalia_surface_container_highest}] #W \
#[fg=#{@noctalia_surface_container_highest},bg=#{@noctalia_surface_container_low}]"
set -g window-status-current-format "\
#[fg=#{@noctalia_on_secondary_container},bg=#{@noctalia_surface_container_low}]\
#[fg=#{@noctalia_surface},bg=#{@noctalia_on_secondary_container},bold] #I \
#[fg=#{@noctalia_on_surface},bg=#{@noctalia_surface_container_highest},bold] #W \
#[fg=#{@noctalia_surface_container_highest},bg=#{@noctalia_surface_container_low}]"

# C-hjkl across tmux panes and nvim splits (nvim-tmux-navigation).
# https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind r source ~/.config/tmux/tmux.conf
bind -T tree-mode C-n command-prompt -p 'new session:' 'new-session -d -s "%%" \; switch-client -t "=%%"'

set -g @resurrect-capture-pane-contents 'off'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
run-shell ~/.tmux/plugins/cpu/cpu.tmux
run-shell ~/.tmux/plugins/resurrect/resurrect.tmux
run-shell ~/.tmux/plugins/continuum/continuum.tmux
source-file -q "$HOME/.config/tmux/themes/noctalia.conf"
